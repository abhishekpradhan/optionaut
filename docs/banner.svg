<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Optionaut — learn options by flying them">
  <defs>
    <radialGradient id="nebula" cx="20%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1c5cab" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1c5cab" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="90%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#199e70" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#199e70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gainWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3987e5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3987e5" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0b0e14"/>
  <rect width="1200" height="300" fill="url(#nebula)"/>
  <rect width="1200" height="300" fill="url(#nebula2)"/>

  <!-- condor payoff scene, right side -->
  <g transform="translate(640,30)">
    <!-- profit wash under the tent -->
    <polygon points="120,120 190,60 350,60 420,120" fill="url(#gainWash)"/>
    <!-- loss washes -->
    <rect x="30" y="120" width="90" height="60" fill="#e66767" opacity="0.10"/>
    <rect x="420" y="120" width="90" height="60" fill="#e66767" opacity="0.10"/>
    <!-- zero line -->
    <line x1="10" y1="120" x2="530" y2="120" stroke="#3a4356" stroke-width="1"/>
    <!-- expiry tent -->
    <polyline points="30,180 120,180 190,60 350,60 420,180 510,180"
      fill="none" stroke="#edf1f7" stroke-width="6" opacity="0.10" stroke-linejoin="round"/>
    <polyline points="30,180 120,180 190,60 350,60 420,180 510,180"
      fill="none" stroke="#edf1f7" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- today curve, neon stack -->
    <path d="M30,178 C140,168 175,92 270,88 C365,92 400,168 510,178"
      fill="none" stroke="#3987e5" stroke-width="11" opacity="0.10" stroke-linecap="round"/>
    <path d="M30,178 C140,168 175,92 270,88 C365,92 400,168 510,178"
      fill="none" stroke="#3987e5" stroke-width="5" opacity="0.20" stroke-linecap="round"/>
    <path d="M30,178 C140,168 175,92 270,88 C365,92 400,168 510,178"
      fill="none" stroke="#3987e5" stroke-width="2.6" stroke-linecap="round"/>
    <!-- breakeven diamonds -->
    <rect x="151" y="113.5" width="9" height="9" transform="rotate(45 155.5 118)" fill="#0b0e14" stroke="#edf1f7" stroke-width="1.6"/>
    <rect x="382" y="113.5" width="9" height="9" transform="rotate(45 386.5 118)" fill="#0b0e14" stroke="#edf1f7" stroke-width="1.6"/>
    <!-- scenario marker -->
    <circle cx="270" cy="88" r="10" fill="#3987e5" opacity="0.25"/>
    <circle cx="270" cy="88" r="4.5" fill="#3987e5" stroke="#0b0e14" stroke-width="2"/>
  </g>

  <!-- wordmark -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">
    <circle cx="76" cy="124" r="5" fill="#3987e5"/>
    <circle cx="76" cy="124" r="10" fill="#3987e5" opacity="0.25"/>
    <text x="100" y="134" font-size="40" font-weight="700" letter-spacing="12" fill="#edf1f7">OPTIONAUT</text>
    <text x="102" y="172" font-size="13" letter-spacing="5" fill="#97a1b4">LEARN OPTIONS BY FLYING THEM</text>
    <text x="102" y="212" font-size="11" letter-spacing="3" fill="#5c6577">FREE · EDUCATIONAL · EVERY CRASH IS FREE</text>
  </g>
</svg>
