name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # the lockfile is authored by npm 11; npm 10 (node 22's default)
      # can't reconcile its optional-dependency entries
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
