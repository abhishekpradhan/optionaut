name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install, not npm ci: macOS-authored lockfiles omit the
      # Linux-only wasm optional deps (@emnapi/*) that a clean Linux
      # `npm ci` demands — a long-standing npm resolver gap. install
      # still honors the lockfile and heals the platform-conditional
      # entries.
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
