<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Optionaut mark: an O in orbit — the ring is the O, the bright
       satellite is the pilot (and the app's scenario marker). -->
  <defs>
    <radialGradient id="g" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141a26"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- star specks -->
  <circle cx="14" cy="13" r="1" fill="#cfe0f7" opacity="0.5"/>
  <circle cx="52" cy="47" r="0.8" fill="#cfe0f7" opacity="0.35"/>
  <circle cx="47" cy="12" r="0.7" fill="#cfe0f7" opacity="0.3"/>
  <!-- orbit ring glow + core -->
  <circle cx="32" cy="33" r="15.5" fill="none" stroke="#3987e5" stroke-width="9" opacity="0.16"/>
  <circle cx="32" cy="33" r="15.5" fill="none" stroke="#3987e5" stroke-width="4.5"/>
  <!-- satellite on the ring, upper right, with halo -->
  <circle cx="43.6" cy="22.7" r="7.5" fill="#3987e5" opacity="0.28"/>
  <circle cx="43.6" cy="22.7" r="4.4" fill="#edf1f7"/>
</svg>
